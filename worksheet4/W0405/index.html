<!DOCTYPE html>
<html>
<head>
<title>W0405</title>
<script type="text/javascript" src="../MV.js"></script>
<script type="text/javascript" src="myscript.js"></script>
</head>
<body>
<div>
<button id="decrement-button">Decrement subdivision</button>
<button id="increment-button">Increment subdivision</button>
<span id="level-label"></span>
</div>
<div>
<label>k<sub>d</sub> <input type="range" id="kd-slider" min="0" max="1" step="0.01" value="0.8"> <span id="kd-value"></span></label><br>
<label>k<sub>s</sub> <input type="range" id="ks-slider" min="0" max="1" step="0.01" value="0.5"> <span id="ks-value"></span></label><br>
<label>s <input type="range" id="shininess-slider" min="1" max="200" step="1" value="40"> <span id="shininess-value"></span></label><br>
<label>L<sub>e</sub> <input type="range" id="le-slider" min="0" max="2" step="0.01" value="1"> <span id="le-value"></span></label><br>
<label>L<sub>a</sub> <input type="range" id="la-slider" min="0" max="1" step="0.01" value="0.2"> <span id="la-value"></span></label>
</div>
<canvas id="my-canvas" width="512" height="512">
Please use a browser that supports HTML5 canvas.
</canvas>
